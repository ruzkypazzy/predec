[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predec"
version = "0.1.0"
description = "Detect and quantify biases in RLHF preference datasets (length, position, sycophancy, verbosity)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "predec contributors" }]
keywords = ["rlhf", "preference-data", "bias-detection", "reward-modeling", "alignment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "datasets>=2.16",
    "openai>=1.30",
    "tiktoken>=0.5",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
embeddings = [
    # Optional local embeddings (sentence-transformers). Used as fallback if no OpenAI key.
    "sentence-transformers>=2.6",
]

[project.scripts]
predec = "predec.cli:app"

[project.urls]
Homepage = "https://github.com/ruzkypazzy/predec"
Issues = "https://github.com/ruzkypazzy/predec/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
predec = ["templates/*.html", "templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
